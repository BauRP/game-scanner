name: Read-only source audit
on:
  pull_request:
    paths:
      - 'scripts/probe-sources.js'
      - 'src/sources.js'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-sources.js
